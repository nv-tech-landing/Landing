<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NV Tech</title>
<meta name="description" content="NV Tech">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 4 L34 20 L20 36 L6 20 Z' fill='none' stroke='%2321B7A8' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    min-height:100svh;
    background:#134E4A;
    color:#fff;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1px);
    background-size:26px 26px;
    pointer-events:none;
  }
  .logo{
    position:relative;
    display:flex; align-items:center; gap:16px;
  }
  .logo svg{ width:52px; height:52px; }
  .logo span{
    font-family:'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    font-size:1.6rem; font-weight:700;
    letter-spacing:0.14em;
  }
</style>
</head>
<body>

  <div class="logo" role="img" aria-label="NV Tech">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M20 4 L34 20 L20 36 L6 20 Z" stroke="#21B7A8" stroke-width="1.6"/>
      <line x1="6" y1="20" x2="34" y2="20" stroke="#21B7A8" stroke-width="1.2"/>
      <line x1="20" y1="4" x2="20" y2="36" stroke="#21B7A8" stroke-width="1.2"/>
      <circle cx="20" cy="4" r="2.6" fill="#21B7A8"/>
      <circle cx="20" cy="36" r="2.6" fill="#21B7A8"/>
      <circle cx="6" cy="20" r="2.6" fill="#21B7A8"/>
      <circle cx="34" cy="20" r="2.6" fill="#21B7A8"/>
    </svg>
    <span>NV Tech</span>
  </div>

</body>
</html>
